<<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pastel 3D con A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <!-- Fondo -->
    <a-sky color="#BDE0FE"></a-sky>

    <!-- Piso -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#F8EDEB">
    </a-plane>

    <!-- Plato -->
    <a-cylinder
      position="0 0.15 -4"
      radius="2"
      height="0.2"
      color="#FFFFFF">
    </a-cylinder>

    <!-- Primera capa del pastel -->
    <a-cylinder
      position="0 0.8 -4"
      radius="1.5"
      height="1.2"
      color="#D2691E">
    </a-cylinder>

    <!-- Betún de la primera capa -->
    <a-cylinder
      position="0 1.45 -4"
      radius="1.58"
      height="0.25"
      color="#FFB6C1">
    </a-cylinder>

    <!-- Segunda capa -->
    <a-cylinder
      position="0 1.75 -4"
      radius="1.25"
      height="0.7"
      color="#E8A87C">
    </a-cylinder>

    <!-- Betún superior -->
    <a-cylinder
      position="0 2.15 -4"
      radius="1.33"
      height="0.25"
      color="#FFF0F5">
    </a-cylinder>

    <!-- Cerezas -->
    <a-sphere
      position="-0.7 2.4 -4"
      radius="0.15"
      color="#C1121F">
    </a-sphere>

    <a-sphere
      position="0 2.45 -4"
      radius="0.15"
      color="#C1121F">
    </a-sphere>

    <a-sphere
      position="0.7 2.4 -4"
      radius="0.15"
      color="#C1121F">
    </a-sphere>

    <!-- Vela -->
    <a-cylinder
      position="0 2.8 -4"
      radius="0.08"
      height="0.8"
      color="#4CC9F0">
    </a-cylinder>

    <!-- Llama -->
    <a-cone
      position="0 3.35 -4"
      radius-bottom="0.12"
      radius-top="0"
      height="0.3"
      color="#FF9F1C">
    </a-cone>

    <!-- Luces -->
    <a-light
      type="ambient"
      color="#FFFFFF"
      intensity="1">
    </a-light>

    <a-light
      type="point"
      position="0 4 -3"
      color="#FFF3B0"
      intensity="2">
    </a-light>

    <!-- Cámara -->
    <a-camera position="0 2 -7"></a-camera>

  </a-scene>

</body>
</html>
